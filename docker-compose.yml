services:
  # ----------------------------------------------------------------
  # SERVICIO 1: SPRING BOOT (ms-resume)
  # ----------------------------------------------------------------
  ms-resume:
    container_name: cris_ms_resume
    build: ./ms-resume
    restart: always
    ports:
      # Puerto expuesto solo al host local (127.0.0.1) para Nginx
      - "127.0.0.1:8080:8080"
    env_file:
      - ./ms-resume/.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # ms-resume se comunica con ms-render-cv a través de la red interna de Docker
      - CONFIG_RENDERCV_URL=http://ms-render-cv:8000
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx2048m
      - DB_PATH=${DB_PATH:-/data/ms-resume.db}
    volumes:
      - ${DB_DATA_PATH:-./data}:/data
    networks:
      - portfolio_net
    depends_on:
      - ms-render-cv
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[j]ava.*app.jar' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ----------------------------------------------------------------
  # SERVICIO 2: FASTAPI + RENDERCV (ms-render-cv) - SOLO INTERNO
  # ----------------------------------------------------------------
  ms-render-cv:
    container_name: cris_ms_render_cv
    build: ./ms-render-cv
    restart: always
    # NO HAY 'ports' - Este servicio no es accesible desde el exterior
    expose:
      # Solo es accesible desde la red interna de Docker en el puerto 8000
      - "8000"
    environment:
      - WORKERS=1
    networks:
      - portfolio_net
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[u]vicorn' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ----------------------------------------------------------------
# RED PRIVADA
# ----------------------------------------------------------------
networks:
  portfolio_net:
    driver: bridge